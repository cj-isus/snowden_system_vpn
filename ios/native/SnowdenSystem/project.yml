name: SnowdenSystem
targets:
  SnowdenSystem:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: SnowdenSystem
        excludes:
          - "**/*.md"
    resources:
      - path: SnowdenSystem/Assets
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snowdensystem.app
        INFOPLIST_FILE: SnowdenSystem/Info.plist
        CODE_SIGN_ENTITLEMENTS: SnowdenSystem/SnowdenSystem.entitlements
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
      configs:
        debug:
          CODE_SIGN_IDENTITY: "iPhone Developer"
          PROVISIONING_PROFILE_SPECIFIER: ""
        release:
          CODE_SIGN_IDENTITY: "iPhone Distribution"
          PROVISIONING_PROFILE_SPECIFIER: ""
    dependencies:
      - framework: build/SnowdenCore.xcframework
        embed: true
        codeSign: true
    info:
      path: SnowdenSystem/Info.plist
      properties:
        CFBundleDisplayName: "Snowden System"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        
  SnowdenSystemVPN:
    type: appExtension
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: SnowdenSystemVPN
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snowdensystem.app.vpn
        INFOPLIST_FILE: SnowdenSystemVPN/Info.plist
        CODE_SIGN_ENTITLEMENTS: SnowdenSystemVPN/SnowdenSystemVPN.entitlements
        SWIFT_VERSION: "5.9"
    dependencies:
      - target: SnowdenSystem
      - framework: build/SnowdenCore.xcframework
        embed: false
        codeSign: false
    info:
      path: SnowdenSystemVPN/Info.plist
      properties:
        CFBundleDisplayName: "Snowden System VPN"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        
schemes:
  SnowdenSystem:
    build:
      targets:
        SnowdenSystem: all
        SnowdenSystemVPN: all
    run:
      config: debug
      askForAppToLaunch: true
      debugEnabled: true
    archive:
      config: release
      revealArchiveInOrganizer: true
